<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Discover open-source repositories gaining momentum, understand the evidence, and keep your own radar." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <title>DevLoot Radar · Open source, in motion</title>
    <script>try{var t=localStorage.getItem('devloot-radar:theme:v1');document.documentElement.className=(t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches))?'theme-natural-mystic':'theme-light'}catch{document.documentElement.className=matchMedia('(prefers-color-scheme: dark)').matches?'theme-natural-mystic':'theme-light'}</script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
